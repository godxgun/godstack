name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: test documentation generator
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: lint demo sources and function complexity
        run: python3 tools/lint_demos.py
      # The website is an external checkout. A consuming workflow can supply
      # GODSTACK_SITE; do not assume it is part of actions/checkout above.
      - name: detect external website checkout
        id: website
        run: |
          if [ -n "${GODSTACK_SITE:-}" ] && [ -f "$GODSTACK_SITE/hugo.toml" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "SKIP external website checks: supply a checkout and GODSTACK_SITE"
          fi
      - name: check generated symbols vault
        if: steps.website.outputs.available == 'true'
        run: python3 tools/generate_docs.py --check
      - name: check published WebAssembly demo artifacts
        if: steps.website.outputs.available == 'true'
        run: python3 tools/build_web_demos.py --check
      - uses: peaceiris/actions-hugo@v3
        if: steps.website.outputs.available == 'true'
        with:
          hugo-version: '0.165.0'
      - name: build static website
        if: steps.website.outputs.available == 'true'
        run: hugo --source "$GODSTACK_SITE" --destination "$RUNNER_TEMP/godstack-site" --cacheDir "$RUNNER_TEMP/hugo-cache" --noBuildLock
      - name: verify public documentation resources and links
        if: steps.website.outputs.available == 'true'
        run: python3 tools/test_site.py "$RUNNER_TEMP/godstack-site"

  snake-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: pinned Emscripten SDK
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.9
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.9
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: real Peak and Rend WebGL2 browser integration
        env:
          CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          python3 tools/test_rend_web.py
          if [ ! -f "${GODSTACK_SITE:-$HOME/rsr/src/site}/hugo.toml" ]; then
            export GODSTACK_SKIP_PUBLISHED=1
          fi
          python3 tools/test_snake_web.py

  linux-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc python3 libvulkan-dev zlib1g-dev libx11-dev libwayland-dev libpulse-dev
      - name: Vulkan 1.4 headers
        run: |
          git clone --depth 1 --branch vulkan-sdk-1.4.304.1 \
            https://github.com/KhronosGroup/Vulkan-Headers.git "$RUNNER_TEMP/vulkan-headers"
          echo "CPATH=$RUNNER_TEMP/vulkan-headers/include" >> "$GITHUB_ENV"
      - name: verify Vulkan headers
        run: |
          printf '#include <vulkan/vulkan.h>\n#ifndef VK_API_VERSION_1_4\n#error Vulkan 1.4 headers required\n#endif\n' | gcc -x c -fsyntax-only -
      - name: build driver
        run: gcc -o build build.c
      - name: package consumer demo
        run: python3 demos/package/demo.py

  linux-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libvulkan-dev libx11-dev libwayland-dev
      - name: build driver
        run: gcc -o build build.c
      - name: public API demos
        run: env -u DISPLAY -u WAYLAND_DISPLAY ./build cpu run

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: package deps
        run: |
          brew install vulkan-headers vulkan-loader
          echo "CPATH=$(brew --prefix vulkan-headers)/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix vulkan-loader)/lib" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$(brew --prefix vulkan-loader)/lib" >> "$GITHUB_ENV"
      - name: build driver
        run: cc -o build build.c
      - name: public API demos
        run: ./build cpu run
      - name: package consumer demo
        run: python3 demos/package/demo.py

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-python
            mingw-w64-x86_64-vulkan-headers
            mingw-w64-x86_64-vulkan-loader
            mingw-w64-x86_64-zlib
      - name: build driver
        run: gcc -o build build.c
      - name: public API demos
        run: ./build cpu run
      - name: package consumer demo
        env:
          CC: gcc
        run: python demos/package/demo.py
