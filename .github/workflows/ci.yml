name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc python3 libvulkan-dev zlib1g-dev libx11-dev libwayland-dev libpulse-dev
      - name: Vulkan 1.4 headers
        run: |
          git clone --depth 1 --branch vulkan-sdk-1.4.304.1 \
            https://github.com/KhronosGroup/Vulkan-Headers.git "$RUNNER_TEMP/vulkan-headers"
          echo "CPATH=$RUNNER_TEMP/vulkan-headers/include" >> "$GITHUB_ENV"
      - name: verify Vulkan headers
        run: |
          printf '#include <vulkan/vulkan.h>\n#ifndef VK_API_VERSION_1_4\n#error Vulkan 1.4 headers required\n#endif\n' | gcc -x c -fsyntax-only -
      - name: build driver
        run: gcc -o build build.c
      - name: package consumer demo
        run: python3 demos/package/demo.py

  linux-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libvulkan-dev libx11-dev libwayland-dev
      - name: build driver
        run: gcc -o build build.c
      - name: public API demos
        run: env -u DISPLAY -u WAYLAND_DISPLAY ./build cpu run

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: package deps
        run: |
          brew install vulkan-headers vulkan-loader
          echo "CPATH=$(brew --prefix vulkan-headers)/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix vulkan-loader)/lib" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$(brew --prefix vulkan-loader)/lib" >> "$GITHUB_ENV"
      - name: build driver
        run: cc -o build build.c
      - name: public API demos
        run: ./build cpu run
      - name: package consumer demo
        run: python3 demos/package/demo.py

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-python
            mingw-w64-x86_64-vulkan-headers
            mingw-w64-x86_64-vulkan-loader
            mingw-w64-x86_64-zlib
      - name: build driver
        run: gcc -o build build.c
      - name: public API demos
        run: ./build cpu run
      - name: package consumer demo
        env:
          CC: gcc
        run: python demos/package/demo.py
